apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hearth

resources:
  - k8s/namespace.yaml
  - k8s/deployment.yaml
  - k8s/service.yaml
  - k8s/httproute.yaml

configMapGenerator:
  - name: site
    files:
      - site/index.html
      - site/style.css
      - site/copy.js
      - site/changes.js
      - site/favicon.svg
      - site/og.png
      - site/recursive-latin.woff2
  - name: nginx-conf
    files:
      - k8s/default.conf
